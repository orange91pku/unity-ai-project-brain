[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-ai-project-brain"
version = "0.1.0"
description = "Unity GUID graph, evidence store, and Context API for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Project Brain contributors" },
]
keywords = [
  "unity",
  "ai-agents",
  "code-intelligence",
  "knowledge-graph",
  "rag",
  "roslyn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/orange91pku/unity-ai-project-brain"
Documentation = "https://github.com/orange91pku/unity-ai-project-brain/tree/main/docs"
Issues = "https://github.com/orange91pku/unity-ai-project-brain/issues"
Repository = "https://github.com/orange91pku/unity-ai-project-brain.git"

[tool.setuptools.packages.find]
include = ["project_brain*"]
